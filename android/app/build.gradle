plugins { id 'com.android.application' }

def skorskalRunNumber = System.getenv('SKORSKAL_BUILD_NUMBER')
def skorskalVersionPatch = skorskalRunNumber?.isInteger() ? Integer.parseInt(skorskalRunNumber) : 0

android {
    namespace 'com.mrdhameri.skorskal'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mrdhameri.skorskal'
        minSdk 29
        targetSdk 34
        versionCode 300000 + skorskalVersionPatch
        versionName "0.3.${skorskalVersionPatch}"
    }
    // The same publisher signing certificate is restored for every GitHub
    // release. It is never committed to the public repository.
    signingConfigs {
        skorskalRelease {
            storeFile file((System.getenv('HOME') ?: '/home/runner') + '/.android/skorskal-signing.keystore')
            storePassword 'android'
            keyAlias 'skorskal'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.skorskalRelease
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
}
