name: Build and publish Skorskal Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'vision.js'
      - 'workbook.js'
      - 'roster-2026.json'
      - 'template.json'
      - 'Skorskal_A4_OMR_40.pdf'
      - 'assets/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

concurrency:
  group: skorskal-android-release
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SKORSKAL_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check out official Skorskal source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bundle latest Skorskal web assets
        run: node android/scripts/prepare-web-assets.mjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore publisher signing certificate
        id: signing-key-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/skorskal-signing.keystore
          key: skorskal-stable-signer-v1

      - name: Verify or create publisher certificate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          SIGNER="$HOME/.android/skorskal-signing.keystore"
          if [[ ! -s "$SIGNER" ]]; then
            NOTES=$(gh release view android-latest --json body --jq '.body' 2>/dev/null || true)
            if echo "$NOTES" | grep -q '^APK_SIGNER_SHA256='; then
              echo "::error::The previous signing certificate is missing from cache. Do not publish an APK with a new signing key. Recover the original keystore first."
              exit 1
            fi
            keytool -genkeypair -noprompt -storetype PKCS12 \
              -keystore "$SIGNER" -storepass android -keypass android \
              -alias skorskal -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=Skorskal, OU=Education, O=MrDhameri, C=MY"
          fi
          test -s "$SIGNER"
          SIGNER_HASH=$(keytool -list -v -keystore "$SIGNER" -storepass android -alias skorskal \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          if [[ ! "$SIGNER_HASH" =~ ^[A-F0-9]{64}$ ]]; then
            echo "::error::Publisher signing certificate fingerprint unavailable"
            exit 1
          fi
          echo "APK_SIGNER_SHA256=$SIGNER_HASH" >> "$GITHUB_ENV"
          echo "Publisher fingerprint: $SIGNER_HASH"

      - name: Cache certificate for all future updates
        if: steps.signing-key-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/skorskal-signing.keystore
          key: skorskal-stable-signer-v1

      - name: Build the publisher-signed, non-debuggable release APK
        run: gradle --no-daemon -p android :app:assembleRelease

      - name: Verify the APK was signed by the permanent publisher certificate
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" > apk-signature.txt
          APK_HASH=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apk-signature.txt | head -n1 | tr '[:lower:]' '[:upper:]')
          if [[ "$APK_HASH" != "$APK_SIGNER_SHA256" ]]; then
            echo "::error::Certificate differs from publisher key. Update cancelled."
            exit 1
          fi
          cp "$APK" Skorskal-OMR.apk
          sha256sum Skorskal-OMR.apk > Skorskal-OMR.apk.sha256

      - name: Upload APK as a GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Skorskal-OMR-Android-APK
          path: Skorskal-OMR.apk
          retention-days: 90
          if-no-files-found: error

      - name: Publish stable update channel (as prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG=android-latest
          CODE=$((300000 + GITHUB_RUN_NUMBER))
          VERSION="0.3.${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Skorskal-OMR.apk Skorskal-OMR.apk.sha256 --clobber
          else
            gh release create "$TAG" Skorskal-OMR.apk Skorskal-OMR.apk.sha256 \
              --target "$GITHUB_SHA" --title "Skorskal Android — Latest APK" \
              --notes "Uploading update metadata…" --prerelease
          fi
          # Publish the new version marker last, once BOTH downloadable files exist.
          gh release edit "$TAG" --notes "APK_VERSION_CODE=${CODE}
          APK_VERSION_NAME=${VERSION}
          APK_SIGNER_SHA256=${APK_SIGNER_SHA256}

          Official Skorskal APK from MrDhameri's GitHub repository.
          Android checks for an update when Skorskal launches, and teachers can
          tap the ↻ update button. The download is SHA-256 verified.
          Android asks for approval before installing; saved records remain local."
